<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>행맨 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 게임 팔레트는 라운드별 파스텔 배경이 핵심이라 라이트/다크 모두 같은 색을 씁니다. */
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --ink:#3a2323;
    --ink-soft:#7a5c5c;
    --card:rgba(255,255,255,.74);
    --line:rgba(58,35,35,.12);
    --orange:#FF9F1C;
    --blue:#5B7CFA;
    --good:#BDF0C6;
    --bad:#F6D2D2;
    --hint:#FFE08A;
    --red:#E5484D;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:light; } }
  :root[data-theme="dark"]{ color-scheme:light; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  *,*::before,*::after{ box-sizing:inherit; }
  body{
    margin:0; min-height:100%;
    font-family:'Jua','Arial Rounded MT Bold','Hiragino Maru Gothic ProN','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--ink);
    background-color:#FFE8D1;
    transition:background-color .9s ease;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  button{ font-family:inherit; color:inherit; }
  :focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }

  .wrap{ max-width:480px; margin:0 auto; padding:14px 16px 28px; }
  .screen{ display:none; }
  .screen.active{ display:block; }

  .card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:28px;
    box-shadow:0 6px 0 rgba(58,35,35,.07);
  }

  /* ---------- 캐릭터 SVG ---------- */
  .svgbox{ display:flex; justify-content:center; }
  .svgbox svg{ display:block; height:clamp(200px,38vh,350px); width:auto; aspect-ratio:720/1110; max-width:100%; overflow:visible; }
  .swing{ transform-origin:205px 20px; animation:sway 3.4s ease-in-out infinite; }
  @keyframes sway{ 0%,100%{ transform:rotate(-2.2deg); } 50%{ transform:rotate(2.2deg); } }
  .lost .swing{ animation:shake .45s ease-in-out 3; }
  @keyframes shake{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-6deg); } 75%{ transform:rotate(6deg); } }
  .part{
    opacity:0; transform:scale(.35);
    transform-box:fill-box; transform-origin:center;
    transition:opacity .3s ease, transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .part.show, .all .part{ opacity:1; transform:none; }

  /* 공책(모눈종이) 느낌의 그림 칸 */
  .paper{
    background-color:#fff;
    background-image:
      linear-gradient(rgba(91,124,250,.17) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,124,250,.17) 1px, transparent 1px);
    background-size:18px 18px;
  }

  /* ---------- 메뉴 ---------- */
  #menu .wrap{ text-align:center; padding-top:22px; }
  .title{ font-size:46px; line-height:1.1; margin:6px 0 4px; letter-spacing:1px; }
  .sub{ margin:0 0 10px; color:var(--ink-soft); font-size:19px; }
  .menu-stage{ padding:14px 10px 6px; margin-bottom:16px; }
  .levels{ display:grid; gap:12px; }
  .level-btn{
    display:flex; align-items:center; gap:14px; width:100%;
    padding:14px 18px; border:none; border-radius:24px; text-align:left;
    font-size:26px; cursor:pointer; box-shadow:0 5px 0 rgba(58,35,35,.14);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .level-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(58,35,35,.14); }
  .level-btn .em{ font-size:34px; }
  .level-btn small{ display:block; font-size:16px; color:var(--ink-soft); margin-top:2px; }
  .level-btn.easy{ background:#C9F0BF; }
  .level-btn.mid{ background:#FFE49B; }
  .level-btn.hard{ background:#FFC3C9; }
  .rules{ margin:16px 4px 0; font-size:16px; color:var(--ink-soft); line-height:1.5; }

  /* ---------- 게임 ---------- */
  .top{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .pill{ background:var(--card); border:2px solid var(--line); border-radius:999px; padding:5px 14px; font-size:18px; white-space:nowrap; }
  .dots{ display:flex; gap:5px; align-items:center; }
  .dots span{ width:11px; height:11px; border-radius:50%; border:2px solid rgba(58,35,35,.35); background:transparent; transition:transform .3s ease, background-color .3s ease; }
  .dots span.reached{ border-color:rgba(58,35,35,.55); }
  .dots span.now{ transform:scale(1.45); }
  .stage{ padding:10px 8px 6px; }

  .word{
    --tw:30px;
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px;
    margin:16px 0 12px; min-height:calc(var(--tw)*1.4 + 6px);
  }
  .tile{
    width:var(--tw); height:calc(var(--tw)*1.4);
    display:flex; align-items:flex-end; justify-content:center;
    border-bottom:4px solid var(--blue);
    font-size:calc(var(--tw)*.92); line-height:1; padding-bottom:2px;
  }
  .tile span{ display:block; }
  .tile.on span{ animation:pop .35s cubic-bezier(.34,1.56,.64,1); }
  .tile.hinted{ color:#D97A00; }
  .tile.miss{ color:var(--red); }
  @keyframes pop{ from{ transform:scale(.3); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .hearts{ display:flex; gap:3px; }
  .hearts span{ font-size:21px; transition:transform .3s ease, opacity .3s ease, filter .3s ease; }
  .hearts span.off{ filter:grayscale(1); opacity:.28; transform:scale(.8); }

  .hint{
    position:relative; border:none; cursor:pointer;
    background:var(--orange); color:var(--ink);
    font-size:22px; padding:9px 22px; border-radius:999px;
    box-shadow:0 4px 0 #D97A00;
    transition:transform .12s ease, box-shadow .12s ease, opacity .2s ease;
  }
  .hint:active:not(:disabled){ transform:translateY(3px); box-shadow:0 1px 0 #D97A00; }
  .hint:disabled{ opacity:.45; cursor:not-allowed; box-shadow:0 4px 0 #b8b0a5; background:#f0c98a; }
  .hint b{
    position:absolute; top:-8px; right:-6px; min-width:24px; height:24px; padding:0 6px;
    display:flex; align-items:center; justify-content:center;
    background:var(--ink); color:#fff; border-radius:999px; font-size:15px; font-weight:400;
  }

  .kb{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .key{
    flex:0 0 calc((100% - 48px)/7); height:46px;
    border:none; border-radius:16px; background:#fff; color:var(--ink);
    font-size:23px; cursor:pointer;
    box-shadow:0 4px 0 rgba(58,35,35,.16);
    transition:transform .1s ease, box-shadow .1s ease, background-color .2s ease;
  }
  .key:active:not(:disabled){ transform:translateY(3px); box-shadow:0 1px 0 rgba(58,35,35,.16); }
  .key:disabled{ cursor:default; }
  .key:disabled:not(.correct):not(.wrong):not(.hinted){ opacity:.45; }
  .key.correct{ background:var(--good); box-shadow:none; transform:translateY(3px); }
  .key.hinted{ background:var(--hint); box-shadow:none; transform:translateY(3px); }
  .key.wrong{ background:var(--bad); color:#b06060; box-shadow:none; transform:translateY(3px); text-decoration:line-through; }

  /* ---------- 팝업 ---------- */
  .overlay{
    position:fixed; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center;
    padding:20px; background:rgba(58,35,35,.42);
  }
  .overlay.open{ display:flex; }
  .dialog{
    width:100%; max-width:380px; text-align:center;
    background:#fff; border-radius:30px; padding:26px 20px 22px;
    box-shadow:0 8px 0 rgba(58,35,35,.16);
    animation:dlg .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes dlg{ from{ transform:scale(.7); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .dlg-title{ font-size:36px; line-height:1.15; margin-bottom:8px; }
  .dlg-title.lose{ color:var(--red); font-size:44px; letter-spacing:2px; }
  .dlg-answer{ font-size:22px; color:var(--ink-soft); margin-bottom:12px; word-break:break-all; }
  .dlg-q{ font-size:22px; margin:0 0 18px; line-height:1.35; }
  .dlg-btns{ display:flex; gap:12px; justify-content:center; }
  .btn{
    flex:1; max-width:150px; border:none; border-radius:999px; padding:12px 0;
    font-size:24px; cursor:pointer; box-shadow:0 4px 0 rgba(58,35,35,.16);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(58,35,35,.16); }
  .btn.yes{ background:#A6E7B8; }
  .btn.no{ background:#E3E6EE; }

  /* ---------- 종료 ---------- */
  #end .wrap{ text-align:center; padding-top:40px; }
  .end-card{ padding:30px 22px 26px; }
  .end-card .big{ font-size:40px; margin-bottom:10px; }
  .end-card p{ font-size:22px; line-height:1.4; margin:0 0 20px; }
  .end-card .btn{ max-width:220px; width:100%; }

  .dlg-answer,.dlg-q{ white-space:pre-line; }
  .dlg-title.trophy{ font-size:38px; }
  .level-btn.ko{ background:#DCD3FF; }
  .chip{ margin-top:14px; padding:10px 22px; border:none; border-radius:999px; font-size:20px; background:#fff; box-shadow:0 4px 0 rgba(58,35,35,.14); cursor:pointer; }
  .chip.on{ background:#FFD43B; }
  .tbar{ position:relative; height:26px; border-radius:999px; background:rgba(255,255,255,.75); border:2px solid var(--line); overflow:hidden; margin-bottom:10px; }
  .tbar[hidden]{ display:none; }
  .tbar i{ position:absolute; inset:0 auto 0 0; width:100%; background:#8CE99A; transition:width 1s linear, background-color .3s; }
  .tbar.low i{ background:#FF8787; }
  .tbar span{ position:relative; display:block; text-align:center; font-size:17px; line-height:22px; }
  .tile.gap{ margin-left:10px; }
  .foot{ display:flex; justify-content:center; gap:12px; margin-top:18px; }
  .giveup,.mute{ border:none; border-radius:999px; padding:9px 18px; font-size:18px; background:rgba(255,255,255,.85); box-shadow:0 3px 0 rgba(58,35,35,.14); cursor:pointer; }
  #fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30; }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation:none !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<!-- 시작 화면 -->
<main id="menu" class="screen active">
  <div class="wrap">
    <h1 class="title">행맨 게임</h1>
    <p class="sub">영어 단어를 맞혀서 행맨을 구해 주세요!</p>
    <div class="card paper menu-stage"><div class="svgbox all" id="menuSvgBox"></div></div>
    <div class="levels" role="group" aria-label="난이도 선택">
      <button class="level-btn easy" data-diff="easy"><span class="em">🌱</span><span>초급<small>짧고 쉬운 단어</small></span></button>
      <button class="level-btn mid" data-diff="mid"><span class="em">🌿</span><span>중급<small>익숙한 긴 단어</small></span></button>
      <button class="level-btn hard" data-diff="hard"><span class="em">🌳</span><span>고급<small>길고 어려운 단어</small></span></button>
      <button class="level-btn ko" data-diff="ko"><span class="em">🇰🇷</span><span>한국어 맛보기<small>자음·모음으로 맞혀요</small></span></button>
    </div>
    <button class="chip" id="taBtn" type="button" aria-pressed="false">⏱ 타임어택 (단어당 60초) : OFF</button>
    <p class="rules">틀릴 때마다 행맨이 하나씩 나타나요.<br>6번 틀리면 GAME OVER! 라운드마다 힌트💡는 3번 쓸 수 있어요.</p>
  </div>
</main>

<!-- 게임 화면 -->
<main id="game" class="screen">
  <div class="wrap">
    <div class="top">
      <span class="pill" id="roundPill">라운드 1</span>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <span class="pill" id="levelPill">초급</span>
    </div>
    <div class="tbar" id="tbar" hidden><i id="tfill"></i><span>⏱ <b id="tnum">60</b>초</span></div>
    <div class="card paper stage"><div class="svgbox" id="gameSvgBox"></div></div>
    <div class="word" id="word" aria-live="polite"></div>
    <div class="row">
      <div class="hearts" id="hearts" aria-label="남은 기회"></div>
      <button class="hint" id="hintBtn" type="button">힌트💡<b id="hintCount">3</b></button>
    </div>
    <div class="kb" id="kb" role="group" aria-label="알파벳 선택"></div>
    <div class="foot"><button class="giveup" id="giveBtn" type="button">🏳️ 중도포기</button><button class="mute" id="muteBtn" type="button">🔊 소리 ON</button></div>
  </div>
</main>

<!-- 종료 화면 -->
<main id="end" class="screen">
  <div class="wrap">
    <div class="card end-card">
      <div class="big" id="endBig">👋 게임 종료</div>
      <p id="endMsg"></p>
      <button class="btn yes" id="homeBtn" type="button">처음으로</button>
    </div>
  </div>
</main>

<canvas id="fx"></canvas>
<!-- 예/아니오 팝업 -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-title" id="dlgTitle"></div>
    <div class="dlg-answer" id="dlgAnswer"></div>
    <p class="dlg-q" id="dlgQ"></p>
    <div class="dlg-btns">
      <button class="btn yes" id="yesBtn" type="button">예</button>
      <button class="btn no" id="noBtn" type="button">아니오</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var MAX_WRONG = 6;
  var MAX_HINTS = 3;
  var TA_SEC = 60;
  var MENU_BG = '#FFE8D1';

  // 라운드가 올라갈 때마다 바뀌는 파스텔 배경: 빨강 → 주황 → 노랑 → 초록 → 파랑 → 남색 → 보라 → 하양
  var BGS = ['#FFD3D6','#FFE0C4','#FFF4BF','#D7F3D0','#D0E8FF','#D5D9FF','#EBD9FF','#FFFFFF'];

  var LEVEL_LABEL = { easy:'초급', mid:'중급', hard:'고급', ko:'한국어' };

  // 사전에 실제로 있는 단어만 사용 ("단어:뜻"). 라운드가 올라갈수록 뒤쪽 티어에서 뽑아요.
  function W(s){ return s.split(' '); }
  var WORDS = {
    easy: [
      W('cat:고양이 dog:개 sun:태양 hat:모자 book:책 fish:물고기'),
      W('apple:사과 water:물 house:집 green:초록색 happy:행복한 bread:빵'),
      W('flower:꽃 orange:오렌지 school:학교 garden:정원 friend:친구 pencil:연필'),
      W('kitchen:부엌 teacher:선생님 morning:아침 picture:그림 brother:형제 chicken:닭')
    ],
    mid: [
      W('planet:행성 bridge:다리 forest:숲 travel:여행하다 doctor:의사 market:시장'),
      W('question:질문 problem:문제 machine:기계 weather:날씨 library:도서관 science:과학'),
      W('situation:상황 exercise:운동 hospital:병원 calendar:달력 birthday:생일 umbrella:우산'),
      W('adventure:모험 education:교육 important:중요한 wonderful:멋진 delicious:맛있는 vegetable:채소')
    ],
    hard: [
      W('diligent:부지런한 eloquent:유창한 paradox:역설 pinnacle:정점 tolerance:관용 obstacle:장애물'),
      W('nostalgia:향수 ephemeral:덧없는 meticulous:꼼꼼한 labyrinth:미로 hypocrisy:위선 phenomenon:현상'),
      W('perseverance:인내 entrepreneur:기업가 catastrophe:대참사 camouflage:위장 hypothesis:가설 bureaucracy:관료제'),
      W('onomatopoeia:의성어 quintessential:본질적인 juxtaposition:병치 conscientious:양심적인 kaleidoscope:만화경 pneumonia:폐렴')
    ]
  };
  var KO = W('나무:tree 바다:sea 하늘:sky 고양이:cat 학교:school 친구:friend 바나나:banana 강아지:puppy 우유:milk 고래:whale 나비:butterfly 구름:cloud 노래:song 기차:train 바람:wind 여행:trip');
  var KO_KEYS = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣㅐㅔ';
  var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  var JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
  var JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';

  // 단어를 맞힐 낱칸(units)으로 쪼개요. 영어는 알파벳, 한국어는 자음·모음.
  function mk(text, meaning, ko){
    var units = [], starts = [];
    if (ko){
      for (var i = 0; i < text.length; i++){
        var c = text.charCodeAt(i) - 0xAC00;
        if (c < 0 || c > 11171) return null;
        var ps = [CHO[Math.floor(c / 588)], JUNG[Math.floor((c % 588) / 28)]];
        if (c % 28) ps.push(JONG[c % 28]);
        ps.forEach(function(x, j){ units.push(x); starts.push(j === 0); });
      }
      if (!units.every(function(u){ return KO_KEYS.indexOf(u) >= 0; })) return null;
    } else {
      text = text.toUpperCase();
      if (!/^[A-Z]+$/.test(text)) return null;
      units = text.split('');
      starts = units.map(function(){ return false; });
    }
    return { text:text, units:units, starts:starts, meaning:meaning };
  }

  function $(id){ return document.getElementById(id); }

  // ---------- 상태 ----------
  var S = {
    diff:null, lang:'en', ta:false, maxRound:8, round:1, cleared:0, word:'', units:[], starts:[], meaning:'', timeout:false,
    guessed:new Set(), hinted:new Set(),
    wrong:0, hints:MAX_HINTS, status:'menu', used:{}
  };
  var timer = null;
  var onYes = null, onNo = null;
  var keyEls = {};

  function hangmanSVG(){

    }
    return '' +
'<svg viewBox="-100 0 720 1110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="행맨 캐릭터">' +
'<g fill="none" stroke="' + ink + '" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M-100 1090H120"/>' +
  '<path d="M-20 1090Q-27 560 -20 20"/>' +
  '<path d="M-20 20Q100 15 222 21"/>' +
  '<path d="M-20 150Q40 92 100 25"/>' +
'</g>' +
'<g class="swing">' +
  '<path d="M205 22V122" fill="none" stroke="' + ink + '" stroke-width="10" stroke-linecap="round"/>' +
  part(6,'legs') + part(4,'body') + part(5,'arms') + part(1,'head') + part(2,'eyes') + part(3,'mouth') +
'</g>' +
'</svg>';
  }

  // ---------- 화면 전환 ----------
  function showScreen(name){
    ['menu','game','end'].forEach(function(id){
      $(id).classList.toggle('active', id === name);
    });
    window.scrollTo(0,0);
  }
  function setBg(color){ document.body.style.backgroundColor = color; }
  function roundBg(){ return BGS[Math.min(S.round - 1, BGS.length - 1)]; }

  // ---------- 세팅 ----------
  function buildStatic(){
    $('menuSvgBox').innerHTML = hangmanSVG('menu');
    $('gameSvgBox').innerHTML = hangmanSVG('game');

    var hearts = $('hearts');
    for (var i = 0; i < MAX_WRONG; i++){
      var h = document.createElement('span'); h.textContent = '❤️'; hearts.appendChild(h);
    }
    var dots = $('dots');
    for (var d = 0; d < BGS.length; d++){
      var s = document.createElement('span'); s.style.setProperty('--c', BGS[d]); dots.appendChild(s);
    }

  }

  function buildKeys(){
    var kb = $('kb'); kb.innerHTML = ''; keyEls = {};
    var ko = S.lang === 'ko';
    kb.setAttribute('aria-label', ko ? '자음 모음 선택' : '알파벳 선택');
    (ko ? KO_KEYS : 'ABCDEFGHIJKLMNOPQRSTUVWXYZ').split('').forEach(function(L){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'key'; b.textContent = L;
      b.setAttribute('aria-label', L);
      b.addEventListener('click', function(){ guess(L); });
      kb.appendChild(b); keyEls[L] = b;
    });
  }

  function setTileSize(){
    var len = S.units.length || 1;
    var avail = Math.min(window.innerWidth, 480) - 40;
    var tw = Math.max(18, Math.min(36, Math.floor(avail / len) - 6));
    $('word').style.setProperty('--tw', tw + 'px');
  }

  function buildWord(){
    var box = $('word'); box.innerHTML = '';
    S.units.forEach(function(ch, i){
      var t = document.createElement('div'); t.className = 'tile'; t.dataset.ch = ch;
      if (S.lang === 'ko' && S.starts[i] && i > 0) t.classList.add('gap');
      t.appendChild(document.createElement('span'));
      box.appendChild(t);
    });
    setTileSize();
  }

  // ---------- 소리 (브라우저에서 직접 만든 짧은 브금) ----------
  var AC = null, muted = false;
  function ac(){
    if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
    if (AC && AC.state === 'suspended'){ try { AC.resume(); } catch(e){} }
    return AC;
  }
  function tone(f, t, d, type, v){
    if (muted) return;
    var c = ac(); if (!c) return;
    try {
      var o = c.createOscillator(), g = c.createGain(), s = c.currentTime + t;
      o.type = type || 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(v || 0.16, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + d + 0.05);
    } catch(e){}
  }
  function sfx(kind){
    if (kind === 'win'){
      [523,659,784,1047,784,1047,1319].forEach(function(f, i){ tone(f, i * 0.12, 0.28, 'triangle', 0.16); });
      tone(1568, 0.9, 0.7, 'sine', 0.1); tone(1047, 0.9, 0.7, 'sine', 0.1);
    } else if (kind === 'lose'){
      [392,370,349,330].forEach(function(f, i){ tone(f, i * 0.34, 0.5, 'sawtooth', 0.07); });
      tone(196, 1.4, 1.1, 'sawtooth', 0.07);
    } else if (kind === 'ok'){ tone(880, 0, 0.12, 'sine', 0.1); }
    else if (kind === 'no'){ tone(200, 0, 0.22, 'square', 0.05); }
  }

  // ---------- 파티클 ----------
  var fx = $('fx'), fc = fx.getContext('2d'), ps = [], raf = 0;
  function fitFx(){ fx.width = window.innerWidth; fx.height = window.innerHeight; }
  function burst(n){
    fitFx();
    var cols = ['#FF6B6B','#FFA94D','#FFD43B','#69DB7C','#4DABF7','#9775FA','#F783AC'];
    for (var i = 0; i < n; i++){
      ps.push({ x:fx.width / 2 + (Math.random() - .5) * 140, y:fx.height * .38,
        vx:(Math.random() - .5) * 15, vy:-Math.random() * 14 - 3, s:6 + Math.random() * 7,
        r:Math.random() * 6, vr:(Math.random() - .5) * .4, c:cols[i % cols.length], life:110 + Math.random() * 40 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick(){
    fc.clearRect(0, 0, fx.width, fx.height);
    ps = ps.filter(function(q){ return q.life > 0 && q.y < fx.height + 30; });
    ps.forEach(function(q){
      q.vy += .35; q.x += q.vx; q.y += q.vy; q.vx *= .99; q.r += q.vr; q.life--;
      fc.save(); fc.translate(q.x, q.y); fc.rotate(q.r);
      fc.fillStyle = q.c; fc.globalAlpha = Math.min(1, q.life / 30);
      fc.fillRect(-q.s / 2, -q.s / 3, q.s, q.s * .6); fc.restore();
    });
    if (ps.length) raf = requestAnimationFrame(tick);
    else { raf = 0; fc.clearRect(0, 0, fx.width, fx.height); }
  }

  // ---------- 타임어택 ----------
  var tInt = null, tLeft = TA_SEC;
  function stopTimer(){ clearInterval(tInt); tInt = null; }
  function drawTime(){
    var l = Math.max(tLeft, 0);
    $('tnum').textContent = l;
    $('tfill').style.width = (l / TA_SEC * 100) + '%';
    $('tbar').classList.toggle('low', l <= 10);
  }
  function startTimer(){
    stopTimer();
    if (!S.ta || S.status !== 'playing') return;
    tInt = setInterval(function(){
      tLeft--; drawTime();
      if (tLeft <= 0){ stopTimer(); if (S.status === 'playing'){ S.timeout = true; lose(); } }
    }, 1000);
  }
  function isDlg(){ return $('overlay').classList.contains('open'); }

  // ---------- 게임 흐름 ----------
  function startGame(diff){
    S.diff = diff; S.lang = diff === 'ko' ? 'ko' : 'en';
    S.maxRound = S.lang === 'ko' ? 3 : 8;
    S.round = 1; S.cleared = 0; S.used = {};
    showScreen('game');
    startRound();
  }

  function pickWord(){
    var tier, pool;
    if (S.lang === 'ko'){
      var all = KO.map(function(s){ var p = s.split(':'); return mk(p[0], p[1], true); })
        .filter(Boolean).sort(function(a, b){ return a.units.length - b.units.length; });
      var cs = Math.ceil(all.length / 3);
      tier = Math.min(S.round - 1, 2); pool = all.slice(tier * cs, (tier + 1) * cs);
    } else {
      tier = Math.min(Math.floor((S.round - 1) / 2), 3);
      pool = WORDS[S.diff][tier].map(function(s){ var p = s.split(':'); return mk(p[0], p[1], false); }).filter(Boolean);
    }
    var key = S.diff + ':' + tier, used = S.used[key] || (S.used[key] = new Set());
    var avail = pool.filter(function(w){ return !used.has(w.text); });
    if (!avail.length){ used.clear(); avail = pool.slice(); }
    var w = avail[Math.floor(Math.random() * avail.length)];
    used.add(w.text);
    return w;
  }

  function startRound(){
    clearTimeout(timer); stopTimer(); closeDialog();
    var w = pickWord();
    S.word = w.text; S.units = w.units; S.starts = w.starts; S.meaning = w.meaning;
    S.guessed = new Set(); S.hinted = new Set();
    S.wrong = 0; S.hints = MAX_HINTS; S.status = 'playing'; S.timeout = false;
    $('gameSvgBox').classList.remove('lost');
    buildKeys(); buildWord(); setBg(roundBg());
    tLeft = TA_SEC; $('tbar').hidden = !S.ta; drawTime();
    render(); startTimer();
  }

  function isWon(){
    return S.units.every(function(c){ return S.guessed.has(c); });
  }

  function guess(L){
    if (S.status !== 'playing' || isDlg() || S.guessed.has(L)) return;
    S.guessed.add(L);
    var hit = S.units.indexOf(L) !== -1;
    if (!hit) S.wrong++;
    sfx(hit ? 'ok' : 'no');
    afterMove();
  }

  function useHint(){
    if (S.status !== 'playing' || isDlg() || S.hints <= 0) return;
    var left = [];
    S.units.forEach(function(c){
      if (!S.guessed.has(c) && left.indexOf(c) === -1) left.push(c);
    });
    if (!left.length) return;
    var ch = left[Math.floor(Math.random() * left.length)];
    S.hints--; S.guessed.add(ch); S.hinted.add(ch);
    sfx('ok');
    afterMove();
  }

  function afterMove(){
    if (isWon()) { win(); }
    else if (S.wrong >= MAX_WRONG) { lose(); }
    else { render(); }
  }

  function meaningText(){ return '정답: ' + S.word + ' (뜻: ' + S.meaning + ')'; }

  function win(){
    stopTimer();
    S.status = 'won'; S.cleared = S.round;
    render();
    var last = S.round >= S.maxRound;
    burst(last ? 240 : 110); sfx('win');
    clearTimeout(timer);
    timer = setTimeout(function(){
      if (last){
        openDialog({
          kind:'trophy', title:'🏆 축하합니다!',
          answer:'당신은 단어의 천재?!\n' + meaningText(),
          question:'모든 라운드를 클리어했어요!\n다시 도전하시겠습니까?',
          yes:function(){ S.round = 1; S.cleared = 0; S.used = {}; startRound(); },
          no:endGame
        });
      } else {
        openDialog({
          kind:'win', title:'🎉 정답이에요!', answer:meaningText(),
          question:'다음 라운드에 도전하시겠습니까?',
          yes:function(){ S.round++; startRound(); },
          no:endGame
        });
      }
    }, 800);
  }

  function lose(){
    stopTimer();
    S.status = 'lost';
    $('gameSvgBox').classList.add('lost');
    render(); sfx('lose');
    clearTimeout(timer);
    timer = setTimeout(function(){
      openDialog({
        kind:'lose', title:'GAME OVER',
        answer:(S.timeout ? '⏰ 시간 초과!\n' : '') + meaningText(),
        question:'다시 도전하시겠습니까?',
        yes:function(){ S.round = 1; S.cleared = 0; S.used = {}; startRound(); },
        no:endGame
      });
    }, 1100);
  }

  function giveUp(){
    if (S.status !== 'playing' || isDlg()) return;
    stopTimer();
    openDialog({
      kind:'ask', title:'🏳️ 중도포기', answer:'',
      question:'정말로 포기하시겠습니까...?',
      yes:endGame, no:function(){ startTimer(); }
    });
  }

  function endGame(){
    clearTimeout(timer); stopTimer();
    closeDialog();
    S.status = 'ended';
    var full = S.cleared > 0 && S.cleared >= S.maxRound;
    $('endBig').textContent = full ? '🏆 모두 클리어!' : '👋 게임 종료';
    $('endMsg').textContent = full ? '당신은 단어의 천재?! 최고예요 👏'
      : (S.cleared > 0 ? '라운드 ' + S.cleared + '까지 클리어했어요! 멋져요 👏' : '아쉽지만 다음에 또 도전해 봐요!');
    setBg(MENU_BG);
    showScreen('end');
  }

  // ---------- 팝업 ----------
  function openDialog(cfg){
    var t = $('dlgTitle');
    t.textContent = cfg.title;
    t.className = 'dlg-title ' + cfg.kind;
    $('dlgAnswer').textContent = cfg.answer;
    $('dlgQ').textContent = cfg.question;
    onYes = cfg.yes; onNo = cfg.no;
    var o = $('overlay');
    o.classList.add('open'); o.setAttribute('aria-hidden','false');
    $('yesBtn').focus();
  }
  function closeDialog(){
    var o = $('overlay');
    o.classList.remove('open'); o.setAttribute('aria-hidden','true');
    onYes = null; onNo = null;
  }

  // ---------- 그리기 ----------
  function render(){
    $('roundPill').textContent = '라운드 ' + S.round + '/' + S.maxRound;
    $('levelPill').textContent = (LEVEL_LABEL[S.diff] || '') + (S.ta ? ' ⏱' : '');

    var cur = Math.min(S.round - 1, BGS.length - 1);
    Array.prototype.forEach.call($('dots').children, function(d, i){
      d.style.display = i < S.maxRound ? '' : 'none';
      d.classList.toggle('reached', i <= cur);
      d.classList.toggle('now', i === cur);
      d.style.backgroundColor = i <= cur ? BGS[i] : 'transparent';
    });

    var remaining = MAX_WRONG - S.wrong;
    Array.prototype.forEach.call($('hearts').children, function(h, i){
      h.classList.toggle('off', i >= remaining);
    });

    Array.prototype.forEach.call($('word').children, function(t){
      var ch = t.dataset.ch;
      var shown = S.guessed.has(ch);
      var missed = S.status === 'lost' && !shown;
      if (shown || missed){
        t.firstChild.textContent = ch;
        t.classList.add('on');
      }
      t.classList.toggle('hinted', shown && S.hinted.has(ch));
      t.classList.toggle('miss', missed);
    });

    Object.keys(keyEls).forEach(function(L){
      var b = keyEls[L];
      var g = S.guessed.has(L);
      var inWord = S.units.indexOf(L) !== -1;
      b.disabled = g || S.status !== 'playing';
      b.classList.toggle('correct', g && inWord && !S.hinted.has(L));
      b.classList.toggle('hinted', g && S.hinted.has(L));
      b.classList.toggle('wrong', g && !inWord);
    });

    Array.prototype.forEach.call($('gameSvgBox').querySelectorAll('.part'), function(p){
      p.classList.toggle('show', S.wrong >= parseInt(p.getAttribute('data-stage'), 10));
    });

    $('hintCount').textContent = S.hints;
    $('hintBtn').disabled = S.status !== 'playing' || S.hints <= 0;
  }

  // ---------- 이벤트 ----------
  function bind(){
    Array.prototype.forEach.call(document.querySelectorAll('.level-btn'), function(b){
      b.addEventListener('click', function(){ startGame(b.getAttribute('data-diff')); });
    });
    $('hintBtn').addEventListener('click', useHint);
    $('giveBtn').addEventListener('click', giveUp);
    $('taBtn').addEventListener('click', function(){
      S.ta = !S.ta;
      this.classList.toggle('on', S.ta);
      this.setAttribute('aria-pressed', S.ta ? 'true' : 'false');
      this.textContent = '⏱ 타임어택 (단어당 60초) : ' + (S.ta ? 'ON' : 'OFF');
    });
    $('muteBtn').addEventListener('click', function(){
      muted = !muted; this.textContent = muted ? '🔇 소리 OFF' : '🔊 소리 ON';
    });
    document.addEventListener('pointerdown', ac);
    window.addEventListener('resize', fitFx);
    $('yesBtn').addEventListener('click', function(){ var f = onYes; if (!f) return; closeDialog(); f(); });
    $('noBtn').addEventListener('click', function(){ var f = onNo; if (!f) return; closeDialog(); f(); });
    $('homeBtn').addEventListener('click', function(){
      S.status = 'menu'; setBg(MENU_BG); showScreen('menu');
    });
    document.addEventListener('keydown', function(e){
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (S.status !== 'playing') return;
      if (S.lang !== 'en' || isDlg()) return;
      var m = /^Key([A-Z])$/.exec(e.code || '');
      if (m) guess(m[1]);
    });
    window.addEventListener('resize', setTileSize);
  }

  buildStatic();
  bind();
})();
</script>
</body>
</html>
